version: '3.8'

services:
  scala-backend:
    build: ./finanzas
    container_name: finanzas-backend
    restart: always
    ports:
      - "9000:9000"
    environment:
      - ENV=docker
      - CORS_ALLOWED_ORIGINS=http://localhost:4200
    volumes:
      - ./finanzas/conf:/app/conf
    networks:
      - app-network

  angular-frontend:
    build: ./finanzas-mf
    container_name: finanzas-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - scala-backend
    environment:
      - API_URL=http://scala-backend:9000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge